services:
  db:
    image: postgres:16
    container_name: continuityos_db
    environment:
      POSTGRES_USER: continuity
      POSTGRES_PASSWORD: continuity_pass
      POSTGRES_DB: continuityos
    ports:
      - "5432:5432"
    volumes:
      - continuity_data:/var/lib/postgresql/data

volumes:
  continuity_data: